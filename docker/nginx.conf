server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        application/octet-stream mind;
    }

    # Permitir explícitamente el uso de Cámara y Sensores WebXR en HTTPS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), xr-spatial-tracking=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
